area_id: "JP13"
audio_dir: "/var/www/html/podcast/files"
yt_dlp_path: "/home/kdmsnr/.local/bin/yt-dlp"
# yt-dlp が同時取得するフラグメント数（番組の取得件数ではありません）
concurrent_fragments: 5
# 単一RSS出力の場合
rss_file: "/var/www/html/podcast/rss.xml"
base_url: "http://raspberrypi.local/podcast/files/"
channel_title: "kdmsnr local podcast"
channel_link: "http://raspberrypi.local"
channel_description: "Podcast description"
# カバー画像のHTTP(S) URL、またはaudio_dir内のパス（省略時は画像なし）
# 相対パスはaudio_dirを基準に解決します
# channel_image: "cover.jpg"
expire_month: 6
# true にすると非表示ファイルを除く全形式が削除対象になります（省略時は .mp3 / .m4a のみ）
# delete_all_files: true

